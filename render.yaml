services:
  - type: web
    name: agent-classifier
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-5
      - key: OPENAI_API_KEY
        sync: false
